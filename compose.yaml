# Self-contained read-only viewer for the NVR archive sitting in this folder.
#
# Plug the drive into any machine with Docker, then:
#
#   cd <this folder>
#   docker compose up -d --build
#   open http://localhost:8787
#
# Every path below is relative to this file, so the service follows the drive
# and needs no editing on a new machine. The archive is mounted read-only; the
# only writable location is ./cache, a separate mount holding the index, muxed
# clips and scrub preview frames.
name: nvr-browser

services:
  viewer:
    # Context is ./app, not this folder — the recordings are never part of the
    # build context.
    build: ./app
    image: nvr-browser:latest
    container_name: nvr-browser
    restart: unless-stopped

    volumes:
      # This folder — the archive itself. Read-only, enforced by the kernel.
      - "${NVR_DATA_DIR:-.}:/data:ro"
      # Cache: segment index, muxed clips and the scrub preview frames. This is
      # a separate read-write bind mount pointing at ./cache, so it persists on
      # the drive and travels with it — a new machine starts with scrubbing
      # already instant. The archive above stays read-only; nothing outside this
      # one subdirectory is writable.
      - "./cache:/cache"

    ports:
      # NVR_BIND=127.0.0.1 keeps it on this machine; 0.0.0.0 opens it to the
      # LAN. There is no authentication in front of this service.
      - "${NVR_BIND:-127.0.0.1}:${NVR_PORT:-8787}:8787"

    environment:
      # The day list, timeline and export filenames are local time, so this
      # should match the cameras' timezone.
      TZ: "${TZ:-Europe/Rome}"
      NVR_CLIP_SECONDS: "${NVR_CLIP_SECONDS:-300}"
      NVR_CACHE_LIMIT_GB: "${NVR_CACHE_LIMIT_GB:-8}"
      # Optional: name cameras that aren't in the built-in map, e.g.
      # NVR_CAMERA_NAMES: "scrypted-31=Garage"
      NVR_CAMERA_NAMES: "${NVR_CAMERA_NAMES:-}"
      # Scrub preview warming. Reading ahead is what makes scrubbing instant,
      # but it is real disk work: "day" warms only the day you open, "all" also
      # warms the whole archive at startup, "off" decodes on hover only.
      # On a mechanical or busy drive, leave this at "day" and run "all" once
      # while the drive is otherwise idle.
      NVR_WARM: "${NVR_WARM:-day}"
      NVR_WARM_DELAY_MS: "${NVR_WARM_DELAY_MS:-250}"
      NVR_THUMB_BUCKET: "${NVR_THUMB_BUCKET:-60}"

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot exporter. Writes MP4s to ./export beside this file.
  #
  #   docker compose run --rm exporter list
  #   docker compose run --rm exporter clip --cam <camera-id> \
  #       --start '2025-01-15 02:20' --duration 600 --out /export
  exporter:
    build: ./app
    image: nvr-browser:latest
    profiles: ["export"]
    entrypoint: ["python3", "/app/nvr_export.py"]
    command: ["list"]
    environment:
      TZ: "${TZ:-Europe/Rome}"
      NVR_ROOT: /data
      NVR_CAMERA_NAMES: "${NVR_CAMERA_NAMES:-}"
    volumes:
      - "${NVR_DATA_DIR:-.}:/data:ro"
      - "./export:/export"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
